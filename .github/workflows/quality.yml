name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint + typecheck + build. Sem variáveis de ambiente de propósito:
      # lib/supabase.ts cai no placeholder e o build precisa continuar passando.
      - run: npm run check
      # Avisos alto/crítico em dependências de produção. Exceções conscientes
      # ficam declaradas em audit-gate.cjs; qualquer aviso novo reprova.
      - run: npm run audit:gate
      # Valida a migration em PostgreSQL descartável: replay concorrente,
      # múltiplas compras, estorno, conflito de identidade e RLS.
      - name: Testar livro-caixa de pagamentos
        run: python3 scripts/test_payment_ledger.py
      - name: Testar conversão de formulários
        run: python3 scripts/test_institutional_conversion.py
      - name: Preparar fixture do Instagram
        run: docker pull postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
      - name: Testar classificação e idempotência do Instagram
        run: python3 scripts/test_instagram_integrity.py

      # Portão de produção: este passo só roda se todos os anteriores passaram.
      # Passa a valer quando o secret DEPLOY_HOOK_URL existir (gatilho de deploy
      # do EasyPanel ou deploy hook da Vercel) e o deploy automático por push
      # estiver desligado na plataforma. Sem o secret, nada muda.
      - name: Disparar deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::DEPLOY_HOOK_URL ausente: o deploy segue pelo automático da plataforma."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" -o /dev/null
